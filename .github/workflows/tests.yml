name: tests

on:
  push:
    branches:
    - master
    - develop
  pull_request:
    branches:
    - master
    - develop

jobs:
  # make test and make race run as separate jobs on separate runners, so CI
  # takes as long as the slower of the two rather than their sum. Each runner
  # has its own ports, temp dirs and fuse.conf, so they cannot interfere.
  suite:
    name: make ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      # Let the other target finish, so a failure in one still reports the
      # other's result.
      fail-fast: false
      matrix:
        target: [test, race]
    env:
      WR_TESTSUITE_MAX_PARALLEL: 4
      WR_TESTSUITE_TIMINGS: 1

    steps:
    - uses: actions/checkout@v7.0.0

    # setup-go's own cache is keyed only on the Go version and go.sum, so it
    # shares one key with the lint workflow, whose job finishes first and saves
    # it. These jobs would then restore lint's build cache and compile every
    # dependency from scratch. Cache per target instead, so each restores the
    # objects its own build (with or without -race) needs.
    - name: Setup Go
      uses: actions/setup-go@v6.4.0
      with:
        go-version-file: go.mod
        cache: false

    - name: Cache Go modules and build
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('go.mod', 'go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-${{ matrix.target }}-

    - name: Install container runtimes
      run: |
        sudo apt-get update
        sudo apt-get install -y singularity-container
        docker version
        singularity --version

    # muxfys mounts with allow_other, which fusermount refuses unless
    # user_allow_other is enabled in /etc/fuse.conf. The runner image ships that
    # line commented out, so without this step every muxfys-mounting test skips.
    # It is modelled on the incantation wr applies to its own cloud instances, in
    # cloud.sentinelInitScript, hardened here because a runner image is not ours
    # to know: the sed is anchored, and it is deliberately tolerant of a file that
    # is missing, already enabled, or has no user_allow_other line to uncomment.
    - name: Allow fuse mounts with allow_other
      run: |
        sudo touch /etc/fuse.conf
        sudo sed -i 's/^#[[:space:]]*user_allow_other/user_allow_other/' /etc/fuse.conf
        grep -qE '^[[:space:]]*user_allow_other[[:space:]]*$' /etc/fuse.conf \
          || printf '\nuser_allow_other\n' | sudo tee -a /etc/fuse.conf
        sudo chmod o+r /etc/fuse.conf
        cat /etc/fuse.conf

    - name: Run make ${{ matrix.target }}
      run: make ${{ matrix.target }}

  # Branch protection requires a check named "test", so this job reports the
  # combined result of both suite targets under that name. It must run even when
  # a target fails or is cancelled, because a skipped required check counts as
  # passing.
  test:
    if: always()
    needs: suite
    runs-on: ubuntu-latest
    steps:
    - name: Check both suite targets passed
      run: test "${{ needs.suite.result }}" = success
