name: tests

on:
  push:
    branches:
    - master
    - develop
  pull_request:
    branches:
    - master
    - develop

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      WR_TESTSUITE_MAX_PARALLEL: 4
      WR_TESTSUITE_TIMINGS: 1

    steps:
    - uses: actions/checkout@v7.0.0
    
    - name: Setup Go
      uses: actions/setup-go@v6.4.0
      with:
        go-version-file: go.mod

    - name: Install container runtimes
      run: |
        sudo apt-get update
        sudo apt-get install -y singularity-container
        sg docker -c "docker version"
        singularity --version

    - name: Run tests
      run: sg docker -c "make test"

    - name: Run tests with race detection
      run: sg docker -c "make race"
